# Pyodide（浏览器端 Python/WebAssembly）同源反代：避免 CDN 跨域/网络差异
# 加在 chat-demo 的 443 server 块中；版本与 src/workers/pythonWorker.ts 的 indexURL 对应
location /pyodide/ {
    proxy_pass https://cdn.jsdelivr.net/pyodide/v0.26.4/full/;
    proxy_set_header Host cdn.jsdelivr.net;
    proxy_ssl_server_name on;
    proxy_ssl_name cdn.jsdelivr.net;
    proxy_read_timeout 120s;
    add_header Cache-Control "public, max-age=86400";
}
